version: "3.9"
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: saitynai_db
    ports:
      - "5435:5432"
    volumes:
      - "../files/saitynaiav:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d saitynai_db"]
      interval: 10s
      retries: 5
      timeout: 5s
    networks:
      - dokploy-network

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3003
      DB_HOST: db
      DB_USER: admin
      DB_PASSWORD: admin
      DB_PORT: 5432
      DB_NAME: saitynai_db
      DB_SSL: false
      ACCESS_TOKEN_SECRET: TBbaJd9Yce7+2rLBGswhWxcwpLxX8b5CRDRYDgU3aS0=
      REFRESH_TOKEN_SECRET: 97eHWGnSYDp55KMJPGrW9mrdRoVOkg3Ip4QxnrTzjbA=
    ports:
      - "3003:3003"
    command: ["node", "dist/src/index.js"]
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(api.refurbmymac.online)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api.service=apisvc"
      - "traefik.http.services.apisvc.loadbalancer.server.port=3003"

networks:
  dokploy-network:
    external: true
